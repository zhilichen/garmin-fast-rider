name: Source and design checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate-project.py --check
      - run: python scripts/check-downloads.py
      - run: python scripts/check-generated-fonts.py
      - run: python -m unittest discover -s tests/python -v
