name: Source and design checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python scripts/generate-project.py --check
      - run: python scripts/generate-fonts.py
      - run: git diff --exit-code -- resources/fonts config/display
      - run: python -m unittest discover -s tests/python -v
